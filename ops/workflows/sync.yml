# V16 Phase 1 — copy to .github/workflows/sync.yml together with ops/workflows/pages.yml.
# Generated data is NO LONGER committed to main (it grew the repo ~40 MB/day). Instead:
#   previous data  <- actions/cache (key data-<run>, newest restored), falling back to what is committed in main
#   new data       -> actions/cache + GitHub Pages artifact (deployed by this job)
# Failed runs: the run's data is thrown away, but its sync_history.json line (ok=false + why) is kept.
# One-time setting: repo Settings -> Pages -> Source = "GitHub Actions".
name: Sync listings
on:
  schedule:
    - cron: '7 */2 * * *'    # every 2 hours (full sync: company boards + link re-checks)
    - cron: '22,52 * * * *' # every 30 min: fast pass over high-churn ATS boards only (Greenhouse/Lever/Ashby)
  workflow_dispatch:
    inputs:
      args:
        description: 'Extra args for pipeline.sync (e.g. --only greenhouse --limit 50)'
        required: false
        default: ''
permissions:
  contents: read
  issues: write
  pages: write
  id-token: write
concurrency:
  group: data-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    environment: { name: github-pages }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install requests pillow
      - name: Restore last good data (falls back to the copy committed in main)
        uses: actions/cache/restore@v4
        with:
          path: |
            data
            assets/logos
          key: data-${{ github.run_id }}
          restore-keys: data-
      - name: Snapshot previous data (for the sync report and to roll back a failed run)
        run: |
          cp data/listings.json /tmp/prev_listings.json || echo '{"listings":[]}' > /tmp/prev_listings.json
          rm -rf /tmp/prev_data && cp -r data /tmp/prev_data
      - name: Collect user reports
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: python -m pipeline.reports || echo "reports step failed; keeping previous reports.json"
      - name: Sync from company career sites (refuses to publish on a >15% open-count drop or missing required fields)
        timeout-minutes: 75
        env:
          USAJOBS_API_KEY: ${{ secrets.USAJOBS_API_KEY }}
          USAJOBS_EMAIL: ${{ secrets.USAJOBS_EMAIL }}
        run: |
          if [ "${{ github.event.schedule }}" = "22,52 * * * *" ]; then ARGS="--only greenhouse,lever,ashby --skip-leads"; else ARGS="${{ github.event.inputs.args }}"; fi
          python -m pipeline.sync --workers 24 $ARGS
      - name: Accuracy checks + sync report (fails the run if >8% of listings would disappear, or hard checks fail)
        run: python -m pipeline.qa --prev /tmp/prev_listings.json
      - name: Sync health gate (fails on ±30% open-count swing or >2% dead links)
        run: python ops/health_check.py
      - name: Public status file (numbers + timestamps only)
        run: python ops/status.py
      - name: Company logos (new companies only; robots.txt respected; keeps the old logos on failure)
        timeout-minutes: 30
        run: python -m pipeline.logos || echo "logo step failed; keeping previous logos"
      - name: Failed run -> keep last good data, but log this run in sync_history.json
        if: failure() || cancelled()
        run: |
          [ -f data/sync_history.json ] && cp data/sync_history.json /tmp/hist.json || true
          rm -rf data && cp -r /tmp/prev_data data
          [ -f /tmp/hist.json ] && cp /tmp/hist.json data/sync_history.json || true
          # make sure THIS run is in the history even when it died before the QA step (e.g. publish gate refused)
          python - <<'PY'
          import json,os,datetime
          p='data/sync_history.json';h=json.load(open(p)) if os.path.exists(p) else []
          rid=os.environ['GITHUB_RUN_ID']
          if not any(str(e.get('run'))==rid for e in h):
              h.append({'at':datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'),'ok':False,'why':'run failed before the QA step (see Actions log)','run':rid})
          json.dump(h[-200:],open(p,'w'),indent=0)
          PY
          echo "FAILS=$(python ops/status.py)" >> "$GITHUB_ENV"
      - name: Save data for the next run
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data
            assets/logos
          key: data-${{ github.run_id }}
      - name: Build site artifact (code from main + fresh data)
        if: always()
        run: |
          mkdir -p /tmp/site && rsync -a --exclude .git --exclude .github --exclude screenshots --exclude test-data --exclude 'pipeline/cache' ./ /tmp/site/
      - uses: actions/upload-pages-artifact@v3
        if: always()
        with: { path: /tmp/site }
      - uses: actions/deploy-pages@v4
        if: always()
      - name: Open an issue after 2 consecutive failed syncs (one open issue, later failures comment on it)
        if: failure() && env.FAILS >= 2
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          T="Sync failed ${{ env.FAILS }} times in a row ($(date -u +%Y-%m-%dT%H:%MZ))"
          B="Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          N=$(gh issue list --label sync-failure --state open --json number --jq '.[0].number')
          if [ -n "$N" ]; then gh issue comment "$N" --body "$T — $B"; else gh label create sync-failure --color B60205 -f >/dev/null 2>&1; gh issue create --title "$T" --body "$B" --label sync-failure; fi
