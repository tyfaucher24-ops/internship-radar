name: Daily link check
on:
  schedule:
    - cron: '41 9 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: data-sync
  cancel-in-progress: false
jobs:
  linkcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install requests
      - run: python -m pipeline.linkcheck
      - name: Commit
        run: |
          git config user.name "radar-sync"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet && exit 0
          git commit -m "data: link check $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && exit 0; sleep 10; done; exit 1
